
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập 38 và 39</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #fff7e2;
      background: linear-gradient(135deg, #10172b, #24324c);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    h1 {
      color: #ffd778;
      font-size: clamp(28px, 5vw, 44px);
    }

    .subtitle {
      color: #d1d8e8;
      line-height: 1.7;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 32px;
    }

    .card {
      display: block;
      padding: 28px 20px;
      text-decoration: none;
      color: #fff;
      background: #ffffff0c;
      border: 1px solid #eac36a66;
      border-radius: 18px;
      transition: transform .25s, background .25s;
    }

    .card:hover {
      transform: translateY(-6px);
      background: #ffffff19;
    }

    .emoji {
      font-size: 48px;
    }

    .card h2 {
      color: #ffd778;
    }

    .card p {
      line-height: 1.6;
      color: #d1d8e8;
    }

    .student {
      margin-top: 32px;
      padding: 12px;
      border-radius: 10px;
      background: #00000025;
    }
  </style>
</head>
<body>
  <main>
    <h1>🌟 BÀI TẬP THIẾT KẾ WEB 🌟</h1>
    <p class="subtitle">
      HTML · CSS · JavaScript<br>
      Trang tổng hợp kết quả bài tập
    </p>

    <section class="links">
      <a class="card" href="bai38.html">
        <div class="emoji">🖼️</div>
        <h2>Bài tập 38</h2>
        <p>Nhấn vào đây để xem kết quả bài tập 38.</p>
      </a>

      <a class="card" href="den-keo-quan.html">
        <div class="emoji">🏮</div>
        <h2>Bài tập 39</h2>
        <p>Đèn kéo quân 3D với hiệu ứng JavaScript.</p>
      </a>
    </section>

    <p class="student">
      Sinh viên: [HỌ VÀ TÊN] · MSSV: [MÃ SỐ SINH VIÊN]
    </p>
  </main>
</body>
</html>
